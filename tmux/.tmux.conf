# === GENERAL ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g history-limit 10000
set -g status-interval 5

# === SPLITS ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# === VI MODE ===
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# === PLUGINS (TPM) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Nybkox/tmux-kanagawa'

# === KANAGAWA ===
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "cpu-usage ram-usage time"
set -g @kanagawa-show-powerline true
set -g @kanagawa-show-left-icon session

# === RESURRECT / CONTINUUM ===
set -g @resurrect-capture-pane-contents 'on'
# Disabled auto-restore so new sessions open in $PWD instead of restoring old dotfiles sessions.
# Use Ctrl+b Ctrl+r to manually restore sessions when desired.
set -g @continuum-restore 'off'

# Shortcut to create a new session from inside tmux in current pane path
bind C-c new-session -c "#{pane_current_path}"

# Initialize TPM — must be last line
run '~/.tmux/plugins/tpm/tpm'
